# Cloudflare deployment for the pmse-to-wwb landing page.
#
# A static-assets-only Worker serving one hand-written page, which points at the
# hosted converter in RFutils rather than duplicating a second copy of the same
# tool. No build step: site/ is committed as-is.
#
# Without this file, `wrangler deploy` looks for a static directory at the repo
# root, finds none, and fails with "Could not detect a directory containing
# static files".
#
# `name` must match the Cloudflare project. Change it here if the project was
# created under a different one.

name = "pmse-to-wwb"
compatibility_date = "2026-07-30"

[assets]
directory = "./site"
